<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ViajAI</title>
    <link rel="stylesheet" href="estilos/principal.css">
    <link rel="stylesheet" href="estilos/autenticacao.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <div class="topbar">
        <div class="container">
            <a href="indice.html" class="logo">
                <img src="imagens/logo.png" alt="ViajAI" class="logo-image">
            </a>
        </div>
    </div>

    <!-- Cadastro Container -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Crie sua conta! 🚀</h1>
                <p>Comece a criar seus roteiros personalizados com IA</p>
            </div>

            <!-- Mensagem de erro/aviso (fica no topo para o usuário sempre ver) -->
            <div id="errorMessage" class="error-message hidden" role="alert" aria-live="polite"></div>

            <!-- Cadastro concluído -->
            <div id="cadastroSucesso" class="cadastro-sucesso" role="status" aria-live="polite">
                <div class="cadastro-sucesso-icone">✅</div>
                <h2 id="cadastroSucessoTitulo">Cadastro feito com sucesso!</h2>
                <p id="cadastroSucessoTexto"></p>
                <button type="button" class="btn-primary btn-large" id="btnIrPainel">Ir para o meu painel</button>
            </div>

            <div id="areaFormulario">
            <!-- Formulário de Cadastro -->
            <form id="cadastroForm" class="auth-form">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input 
                        type="text" 
                        id="nome" 
                        placeholder="Seu nome" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="emailCadastro">Email</label>
                    <input 
                        type="email" 
                        id="emailCadastro" 
                        placeholder="seu@email.com" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senhaCadastro">Senha</label>
                    <input 
                        type="password" 
                        id="senhaCadastro" 
                        placeholder="Mínimo 6 caracteres" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senhaConfirm">Confirmar Senha</label>
                    <input 
                        type="password" 
                        id="senhaConfirm" 
                        placeholder="Confirme sua senha" 
                        required
                    >
                </div>

                <div class="form-group checkbox">
                    <input type="checkbox" id="termos" required>
                    <label for="termos">
                        Concordo com os <a href="#" target="_blank">Termos de Serviço</a>
                    </label>
                </div>

                <button type="submit" class="btn-primary btn-large">
                    Criar Conta
                </button>
            </form>

            <!-- Divisor -->
            <div class="auth-divider">
                <span>ou</span>
            </div>

            <!-- Cadastro com Google -->
            <button id="googleSignupBtn" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Cadastrar com Google
            </button>

            <!-- Link para Login -->
            <div class="auth-footer">
                <p>Já tem conta? <a href="login.html">Fazer login</a></p>
            </div>
            </div><!-- /areaFormulario -->

            <!-- Loading -->
            <div id="loadingSpinner" class="loading-spinner hidden">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Imagem Decorativa -->
        <div class="auth-image">
            <div class="image-content">
                <div class="image-icon">✈️</div>
                <h2>Comece Sua Jornada</h2>
                <p>Roteiros personalizados em segundos com IA</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <div class="logo">
                        <img src="imagens/logo.png" alt="ViajAI" class="logo-image-footer">
                    </div>
                    <p>© 2024 VIAJAI. O SEU CONCIERGE DIGITAL</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

    <script src="js/config-firebase.js"></script>
    <script src="js/autenticacao.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
